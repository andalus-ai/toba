# Defaults for running the adapter against a local dev stack (identity-access-service
# and governance-lineage-service both started via `quarkus:dev`). In a real Dremio
# deployment these are supplied through Dremio's own plugin config surface instead —
# see AdapterConfig's Javadoc.
identity.grpc.host=localhost
identity.grpc.port=9090
governance.base-url=http://localhost:8081
semantic-ai.base-url=http://localhost:8083
auth-check.timeout-ms=500
masking-policy.cache-ttl-ms=30000
ai-function.timeout-ms=10000
