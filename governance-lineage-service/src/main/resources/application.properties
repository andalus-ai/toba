quarkus.application.name=governance-lineage-service

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${GOVERNANCE_DB_USER:governance_svc}
quarkus.datasource.password=${GOVERNANCE_DB_PASSWORD:governance_svc}
quarkus.datasource.reactive.url=vertx-reactive:postgresql://${GOVERNANCE_DB_HOST:localhost}:${GOVERNANCE_DB_PORT:5432}/${GOVERNANCE_DB_NAME:governance}
quarkus.datasource.jdbc.url=jdbc:postgresql://${GOVERNANCE_DB_HOST:localhost}:${GOVERNANCE_DB_PORT:5432}/${GOVERNANCE_DB_NAME:governance}
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# --- Kafka: audit ingestion consumer (identity.events today; other services' topics
#     are added as those services start publishing) ---
mp.messaging.incoming.identity-events-in.connector=smallrye-kafka
mp.messaging.incoming.identity-events-in.topic=identity.events
mp.messaging.incoming.identity-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.identity-events-in.group.id=governance-audit-ingestion
mp.messaging.incoming.identity-events-in.auto.offset.reset=earliest

%dev.kafka.bootstrap.servers=localhost:9092
%dev.quarkus.kafka.devservices.enabled=true
%test.quarkus.kafka.devservices.enabled=true

quarkus.micrometer.export.prometheus.enabled=true
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_ENDPOINT:http://localhost:4317}

%dev.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.enabled=true
