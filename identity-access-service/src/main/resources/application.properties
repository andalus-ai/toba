quarkus.application.name=identity-access-service

# --- Reactive datasource (owns its own Postgres DB/schema, no sharing) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${IDENTITY_DB_USER:identity_svc}
quarkus.datasource.password=${IDENTITY_DB_PASSWORD:identity_svc}
quarkus.datasource.reactive.url=vertx-reactive:postgresql://${IDENTITY_DB_HOST:localhost}:${IDENTITY_DB_PORT:5432}/${IDENTITY_DB_NAME:identity}

# Flyway runs over a small JDBC pool at startup only; the reactive datasource above
# is what the app uses at runtime.
quarkus.datasource.jdbc.url=jdbc:postgresql://${IDENTITY_DB_HOST:localhost}:${IDENTITY_DB_PORT:5432}/${IDENTITY_DB_NAME:identity}
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# --- OIDC federation (per-tenant IdP config is also stored in identity_provider_config;
#     this default entry is the platform's own admin-console login) ---
%dev.quarkus.oidc.auth-server-url=http://localhost:8180/realms/dremio-platform
%dev.quarkus.oidc.client-id=identity-access-service
quarkus.oidc.tenant-enabled=true
quarkus.oidc.application-type=service

# --- JWT issuance (tokens the dremio-adapter validates on the coordinator) ---
# Dev-only keypair checked in under src/main/resources/jwt/ for `quarkus:dev` to work
# out of the box. Production deployments MUST override both properties to point at
# Vault/KMS-managed keys (see Section 9 of the architecture plan, "Secrets/keys") and
# MUST NOT reuse this checked-in keypair.
mp.jwt.verify.issuer=https://identity.dremio-platform.internal
mp.jwt.verify.publickey.location=jwt/publicKey.pem
smallrye.jwt.sign.key.location=jwt/privateKey.pem
smallrye.jwt.new-token.issuer=https://identity.dremio-platform.internal
smallrye.jwt.new-token.lifespan=900

# --- Event bus (domain events -> Governance audit ingestion, cache invalidation) ---
mp.messaging.outgoing.identity-events.connector=smallrye-kafka
mp.messaging.outgoing.identity-events.topic=identity.events
mp.messaging.outgoing.identity-events.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
%dev.kafka.bootstrap.servers=localhost:9092
%dev.quarkus.kafka.devservices.enabled=true
%test.quarkus.kafka.devservices.enabled=true

# --- gRPC (AuthCheckService, added in Phase 1 step 5) ---
quarkus.grpc.server.port=9090
quarkus.grpc.server.use-separate-server=true

# --- Observability ---
quarkus.micrometer.export.prometheus.enabled=true
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_ENDPOINT:http://localhost:4317}

# --- Dev services (Testcontainers-backed Postgres for `quarkus dev`) ---
%dev.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.enabled=true
