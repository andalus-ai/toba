quarkus.application.name=workload-orchestrator-service

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${WORKLOAD_DB_USER:workload_svc}
quarkus.datasource.password=${WORKLOAD_DB_PASSWORD:workload_svc}
quarkus.datasource.reactive.url=vertx-reactive:postgresql://${WORKLOAD_DB_HOST:localhost}:${WORKLOAD_DB_PORT:5432}/${WORKLOAD_DB_NAME:workload}
quarkus.datasource.jdbc.url=jdbc:postgresql://${WORKLOAD_DB_HOST:localhost}:${WORKLOAD_DB_PORT:5432}/${WORKLOAD_DB_NAME:workload}
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# --- Kubernetes client (scales executor Deployments/StatefulSets per engine) ---
# Outside a real cluster (local dev, CI), the client falls back to a logging no-op
# — see K8sScalingClient's Javadoc. Set this to false to force that fallback even
# when a kubeconfig happens to be present (e.g. running against a personal cluster
# you don't want this service touching).
workload.k8s.enabled=${WORKLOAD_K8S_ENABLED:false}
quarkus.kubernetes-client.trust-certs=true

# --- Idle-engine auto-stop scheduled job ---
workload.autostop.check-interval=PT1M

# --- Queue-depth-triggered scale-up scheduled job (the other half of "auto-start/
#     stop based on queue depth/queued-query metrics" — idle-autostop above only
#     covers scale-down) ---
workload.scaleup.check-interval=PT30S
# How far back to look when averaging queue depth for a scale-up decision.
workload.scaleup.evaluation-window=PT2M
# Average queued-query count above this triggers a scale-up.
workload.scaleup.queue-depth-threshold=5
# Replicas added per scale-up step (capped at the engine's maxReplicas regardless).
workload.scaleup.increment=1
# Minimum time after a scale-up (or start) before another scale-up is allowed —
# prevents flapping while new pods are still becoming ready.
workload.scaleup.cooldown=PT5M
# Queue-depth samples older than this are pruned on every scheduler run.
workload.scaleup.sample-retention=PT10M

# --- Event bus ---
mp.messaging.outgoing.workload-events.connector=smallrye-kafka
mp.messaging.outgoing.workload-events.topic=workload.events
mp.messaging.outgoing.workload-events.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
%dev.kafka.bootstrap.servers=localhost:9092
%dev.quarkus.kafka.devservices.enabled=true
%test.quarkus.kafka.devservices.enabled=true

quarkus.micrometer.export.prometheus.enabled=true
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_ENDPOINT:http://localhost:4317}

%dev.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.enabled=true
# Scheduler runs in tests too by default; disable to avoid interference with
# fixed-clock unit tests that construct their own Engine states.
%test.quarkus.scheduler.enabled=false

# ScaleUpFlowTest and EngineFlowTest need the scheduler running, so they enable it
# per-test via @TestProfile rather than here — see ScaleUpSchedulerTestProfile.
