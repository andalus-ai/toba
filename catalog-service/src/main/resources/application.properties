quarkus.application.name=catalog-service

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${CATALOG_DB_USER:catalog_svc}
quarkus.datasource.password=${CATALOG_DB_PASSWORD:catalog_svc}
quarkus.datasource.reactive.url=vertx-reactive:postgresql://${CATALOG_DB_HOST:localhost}:${CATALOG_DB_PORT:5432}/${CATALOG_DB_NAME:catalog}
quarkus.datasource.jdbc.url=jdbc:postgresql://${CATALOG_DB_HOST:localhost}:${CATALOG_DB_PORT:5432}/${CATALOG_DB_NAME:catalog}
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# Where new tables' placeholder metadata files and future data files are written.
# Points at an S3-compatible bucket/prefix in real deployments; MinIO in dev.
catalog.warehouse.root=${CATALOG_WAREHOUSE_ROOT:s3://dremio-platform-dev-warehouse}

# LocalFilesystemObjectStorageClient's actual write location (see its Javadoc) —
# catalog.warehouse.root above stays s3://-shaped so TableService's location-
# building logic matches what a real deployment would produce; this is where
# those locations actually resolve to on disk in this increment, since no real
# S3-compatible client is wired in yet.
catalog.storage.local-root=${CATALOG_STORAGE_LOCAL_ROOT:/tmp/dremio-platform-catalog-storage}

# Which ObjectStorageClient implementation RoutingObjectStorageClient delegates
# to: "local" (default, dev-safe) or "s3" (real S3/S3-compatible — see
# S3ObjectStorageClient's Javadoc for the "checked the API, not tested against a
# live bucket" caveat).
catalog.storage.backend=${CATALOG_STORAGE_BACKEND:local}
catalog.storage.s3.region=${CATALOG_STORAGE_S3_REGION:us-east-1}
# Set for MinIO or any non-AWS S3-compatible endpoint; leave unset for real AWS S3.
catalog.storage.s3.endpoint-override=${CATALOG_STORAGE_S3_ENDPOINT:}
# Explicit static credentials (common for MinIO/local testing) — if either is
# unset, S3ObjectStorageClient falls back to the AWS SDK's normal credential
# chain (env vars, ~/.aws/credentials, instance profile), appropriate for real
# AWS deployments that use IAM roles instead of long-lived keys.
catalog.storage.s3.access-key=${CATALOG_STORAGE_S3_ACCESS_KEY:}
catalog.storage.s3.secret-key=${CATALOG_STORAGE_S3_SECRET_KEY:}
# Path-style (http://endpoint/bucket/key) vs virtual-hosted (http://bucket.endpoint/key)
# addressing — MinIO and most self-hosted S3-compatible stores need path-style;
# real AWS S3 works with either but defaults to virtual-hosted.
catalog.storage.s3.path-style-access=${CATALOG_STORAGE_S3_PATH_STYLE:true}

# --- Event bus (catalog.events -> Governance audit/lineage ingestion, once a
#     corresponding consumer is added on that side; publisher wired here now so the
#     shape exists for that consumer to target) ---
mp.messaging.outgoing.catalog-events.connector=smallrye-kafka
mp.messaging.outgoing.catalog-events.topic=catalog.events
mp.messaging.outgoing.catalog-events.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
%dev.kafka.bootstrap.servers=localhost:9092
%dev.quarkus.kafka.devservices.enabled=true
%test.quarkus.kafka.devservices.enabled=true

quarkus.micrometer.export.prometheus.enabled=true
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_ENDPOINT:http://localhost:4317}

%dev.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.enabled=true
