quarkus.application.name=semantic-ai-service

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${AI_DB_USER:semantic_ai_svc}
quarkus.datasource.password=${AI_DB_PASSWORD:semantic_ai_svc}
quarkus.datasource.reactive.url=vertx-reactive:postgresql://${AI_DB_HOST:localhost}:${AI_DB_PORT:5432}/${AI_DB_NAME:semantic_ai}
quarkus.datasource.jdbc.url=jdbc:postgresql://${AI_DB_HOST:localhost}:${AI_DB_PORT:5432}/${AI_DB_NAME:semantic_ai}
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# Dev Services' default Postgres image lacks the pgvector extension V1 needs.
# Override the image to a pgvector-enabled one for `quarkus:dev`/tests:
%dev.quarkus.datasource.devservices.image-name=pgvector/pgvector:pg16
%test.quarkus.datasource.devservices.image-name=pgvector/pgvector:pg16
%dev.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.enabled=true

# --- LLM provider ---
# Mock mode (default) uses a deterministic, hash-based pseudo-embedding and canned
# completions — NOT real AI output, just enough determinism to exercise the
# embedding/search/wiki-suggestion pipeline without an API key or cost. Flip to
# false only once quarkus.langchain4j.anthropic.api-key is set to a real key — see
# MockLlmClient's and AnthropicLlmClient's Javadoc for exactly what each does.
ai.mock-mode=${AI_MOCK_MODE:true}
ai.embedding.model-name=mock-embedding-v1
ai.embedding.dimension=1536

# Chat: Anthropic.
quarkus.langchain4j.anthropic.api-key=${ANTHROPIC_API_KEY:}
quarkus.langchain4j.anthropic.chat-model.model-name=claude-sonnet-4-6
quarkus.langchain4j.anthropic.timeout=30s

# Embeddings: OpenAI (Anthropic has no embeddings API — see LlmClient's Javadoc).
# ai.embedding.provider selects mock vs openai independently of ai.mock-mode — see
# RoutingLlmClient's Javadoc for exactly how these two flags interact.
# quarkus.langchain4j.openai.chat-model.enabled=false below is IMPORTANT: without
# it, both the anthropic and openai extensions register a ChatLanguageModel CDI
# bean, and AnthropicChatClient's @Inject ChatLanguageModel becomes ambiguous.
# (If your quarkus-langchain4j version doesn't support this property, use a
# @ModelName-qualified injection point in AnthropicChatClient instead.)
ai.embedding.provider=${AI_EMBEDDING_PROVIDER:mock}
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:}
quarkus.langchain4j.openai.embedding-model.model-name=text-embedding-3-small
quarkus.langchain4j.openai.chat-model.enabled=false

# --- Kafka: auto-embed new tables (catalog.events -> embedding pipeline) ---
mp.messaging.incoming.catalog-events-in.connector=smallrye-kafka
mp.messaging.incoming.catalog-events-in.topic=catalog.events
mp.messaging.incoming.catalog-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.catalog-events-in.group.id=semantic-ai-embedding-pipeline
mp.messaging.incoming.catalog-events-in.auto.offset.reset=earliest

%dev.kafka.bootstrap.servers=localhost:9092
%dev.quarkus.kafka.devservices.enabled=true
%test.quarkus.kafka.devservices.enabled=true

quarkus.micrometer.export.prometheus.enabled=true
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_ENDPOINT:http://localhost:4317}

# --- Security: verify the platform JWTs identity-access-service issues ---
# DEV-ONLY: the public key here is a checked-in copy of identity-access-service's
# dev keypair (see that service's application.properties for the same warning).
# Production deployments must point mp.jwt.verify.publickey.location at the real
# shared key or a JWKS endpoint identity-access-service exposes — never a copied
# file, since a copy can silently drift from whatever key that service actually
# signs with after a rotation.
mp.jwt.verify.issuer=https://identity.dremio-platform.internal
mp.jwt.verify.publickey.location=jwt/identity-service-publicKey.pem

# The MCP endpoint (and everything else) requires a valid platform JWT. This is a
# path-based blanket rule rather than per-tool @RolesAllowed annotations, since
# every tool in this increment (search_datasets, get_dataset_embeddings) only
# needs "is a known platform principal", not a specific role — see module README
# "Known gaps" for why finer-grained per-tool authz (e.g. requiring
# catalog.dataset.read for search_datasets, mirroring identity-access-service's
# permission model) isn't wired in yet.
quarkus.http.auth.permission.mcp.paths=/mcp,/mcp/*
quarkus.http.auth.permission.mcp.policy=authenticated

# --- gRPC client: identity-access-service's AuthCheckService, for per-tool MCP
#     authorization (see mcp/McpAuthorizationService) ---
quarkus.grpc.clients.auth-check.host=${IDENTITY_GRPC_HOST:localhost}
quarkus.grpc.clients.auth-check.port=${IDENTITY_GRPC_PORT:9090}
# Real deployments terminate TLS here (mutual TLS between services — plan Section 9);
# plaintext is for local dev only, same convention as dremio-adapter's AuthCheckGrpcClient.
quarkus.grpc.clients.auth-check.plain-text=true

# Test-only: lets McpSecurityTest mint valid tokens via smallrye-jwt-build (test
# scope only — see that dependency's test-scope declaration in pom.xml). This
# service itself never signs tokens in main/production config, only verifies them.
%test.smallrye.jwt.sign.key.location=jwt/test-signing-privateKey.pem
%test.smallrye.jwt.new-token.issuer=https://identity.dremio-platform.internal
